name: Systemd Images

on:
  workflow_dispatch:

jobs:
  debian:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: [12, 13]
        puppet: [8, 9]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Prepare Dockerfile
        run: sed -i "s|openvox8|openvox${{ matrix.puppet }}|g" debian/${{ matrix.version }}.Dockerfile

      - name: Build and push multi-architecture image
        run: |
          IMAGE_ID=ghcr.io/luckyraul/systemd:debian-${{ matrix.version }}-v${{ matrix.puppet }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          docker buildx build \
            --file debian/${{ matrix.version }}.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag $IMAGE_ID \
            --push .

  ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version: ['24', '26']
        puppet: [8, 9]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Prepare Dockerfile
        run: sed -i "s|openvox8|openvox${{ matrix.puppet }}|g" ubuntu/${{ matrix.version }}.Dockerfile

      - name: Build and push multi-architecture image
        run: |
          IMAGE_ID=ghcr.io/luckyraul/systemd:ubuntu-${{ matrix.version }}-v${{ matrix.puppet }}
          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          docker buildx build \
            --file ubuntu/${{ matrix.version }}.Dockerfile \
            --platform linux/amd64,linux/arm64 \
            --tag $IMAGE_ID \
            --push .
