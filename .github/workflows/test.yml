  acceptance_debian_future:
    name: Acceptance on Debian Next family
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        VERSION: [8]
        OS: [debian-14]
    steps:
      - uses: actions/checkout@v7
      - name: Install the PDK
        run: |
          VERSION=2.5.0
          curl -LO "https://github.com/voxpupuli/jig/releases/download/v${VERSION}/jig_${VERSION}_linux_amd64.deb"
          sudo apt install "./jig_${VERSION}_linux_amd64.deb"
      - name: Create Dockerfile for Debian-family
        shell: bash
        if: startsWith(matrix.OS, 'debian') || startsWith(matrix.OS, 'ubuntu')
        run: |
          jig build
          DYNAMIC_FILE=$(basename pkg/*.tar.gz)
          cat <<EOF > Dockerfile
          FROM ghcr.io/luckyraul/systemd:${{ matrix.OS }}-v${{ matrix.VERSION }}
          COPY pkg/${DYNAMIC_FILE} .
          RUN /opt/puppetlabs/bin/puppet module install /${DYNAMIC_FILE} && rm -f /${DYNAMIC_FILE} && /opt/puppetlabs/bin/puppet module install puppetlabs-dummy_service
          EOF
      - name: Build Docker image
        run: docker build -t puppet-lab:${GITHUB_RUN_ID} .
      - name: Run Image
        run: docker container run -d --name=puppet-lab --rm -t --privileged -v /sys/fs/cgroup:/sys/fs/cgroup:rw --cgroupns=host puppet-lab:${GITHUB_RUN_ID}
      - name: Test Container
        run: docker exec -t puppet-lab cat /etc/os-release
      - name: Stop Container
        run: docker stop puppet-lab
      # - name: Setup tmate session
      #   uses: mxschmitt/action-tmate@v3
      - name: Run Rspec
        run: bundle exec rspec